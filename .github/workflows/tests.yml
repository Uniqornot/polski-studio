name: Проверки
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Тесты в контейнере
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Получить исходники
        uses: actions/checkout@v4
      - name: Собрать тестовый контейнер
        run: docker build --target test -t polski-studio:test .
      - name: Запустить проверки
        run: docker run --rm polski-studio:test
